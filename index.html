cam:'<circle cx="12" cy="13" r="3.8"/><path d="M4 8h3l2-3h6l2 3h3v11H4z"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const inf='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
const fx=n=>s.fx==n?" in":"";
let lastT=0;

function mlist(){
  const q=nz(s.mq||""),ms=D.models.filter(m=>m.on&&m.t==s.t&&nz(nm(m)).includes(q)).reverse();
  let g="",h="";
  ms.forEach(m=>{const k=s.t=="i"?m.n.split(" ")[0]:"";if(k!=g){g=k;if(k)h+=`<div class="gh">iPhone ${e(k)}</div>`}h+=`<button class="opt" data-a="m" data-v="${e(m.n)}">${e(nm(m))}</button>`});
  return h||'<p class="mu" style="padding:12px">Nenhum modelo encontrado.</p>';
}

function home(){
  const m=s.m&&cur();
  const step=!m?0:!s.ids?1:s.sel.length?3:2;
  let h=`<div class="prog noprint">${[0,1,2].map(i=>`<i class="${step>i?"on":""}"></i>`).join("")}</div>`;
  if(!m){
    return h+`<h1 class="big">Qual é o seu aparelho?</h1>
    <button class="field${s.dd?" open":""}" data-a="dd"><span>Escolher aparelho</span>${chev}</button>`
    +(s.dd?`<div class="dd${fx("dd")}"><div class="seg">${[["i","iPhone"],["w","Apple Watch"]].map(([k,l])=>`<button class="${s.t==k?"on":""}" data-a="t" data-v="${k}">${l}</button>`).join("")}</div><input id="mq" placeholder="Buscar modelo, ex.: 13 pro" value="${e(s.mq)}" autocomplete="off"><div id="ml">${mlist()}</div></div>`:"");
  }
  h+=`<div class="pills noprint"><button class="pill" data-a="em">${e(nm(m))}<u>alterar</u></button>${s.ids&&s.t=="i"?`<button class="pill" data-a="ey">${e(s.lab||"Todos os serviços")}<u>alterar</u></button>`:""}</div>`;
  if(!s.ids){
    return h+`<h1 class="big${fx("y")}">O que aconteceu com o ${e(nm(m))}?</h1>
    ${Y.map((y,i)=>`<button class="opt2${fx("y")}" style="--i:${i+1}" data-a="y" data-v="${i}">${svg(y[0])}${y[1]}</button>`).join("")}
    <div class="${fx("y")}" style="--i:6;display:flex;gap:8px;margin-top:16px"><input id="q" placeholder="Ou conte com suas palavras: caiu e trincou" value="${e(s.q)}"><button class="btn" style="background:var(--fl)" data-a="q">Buscar</button></div>
    <button class="chip" style="margin-top:12px" data-a="all">Ver todos os serviços</button>`;
  }
  const l=D.services.filter(v=>v.on&&ty(v)==s.t&&price(v.id,s.m)&&(s.t=="w"||s.ids=="all"||s.ids.includes(v.id)));
  const sl=s.sel.map(id=>D.services.find(x=>x.id==id)).filter(Boolean);
  const tot=sl.reduce((a,v)=>a+price(v.id,s.m),0),hasF=sl.some(v=>v.fl.includes("f")),pre=hasF?"a partir de ":"";
  if(s.note)h+=`<div class="tp">${e(s.note)}</div>`;
  if(l.some(v=>v.fl.includes("r")))h+=`<div class="wn${s.rk?" open":""}" data-a="rk"><div class="wh">${inf}<span><b>Antes de trocar o vidro</b><small>Procedimento delicado, com risco de falha no display.${s.rk?"":" Toque para ler."}</small></span>${chev}</div>${s.rk?`<p>${RISCO}</p>`:""}</div>`;
  if(l.length>1&&l.some(v=>v.id=="tela")&&l.some(v=>v.id=="vidro"))h+=`<div class="tp noprint">Mais de uma opção resolve o problema. A troca de vidro mantém o seu display original; a tela premium troca a tela completa e tem garantia contratual de 1 ano.</div>`;
  if(!l.length)h+=`<p class="mu">Não há valor cadastrado para este problema neste modelo. <a style="color:var(--tx)" href="${link("Olá! Quero um orçamento para "+nm(m))}">Consulte no WhatsApp</a>.</p>`;
  h+=l.map((v,n)=>{const on=s.sel.includes(v.id);return `<div class="card${on?" on":""}${fx("res")}" style="--i:${n}" data-a="s" data-v="${v.id}"><span class="ck"></span><div style="flex:1"><h3>${e(v.n)}</h3><p>${e(v.d)}</p>${v.fl.includes("g")?'<span class="bd">Garantia contratual de 1 ano</span>':""}</div><div class="pr">${v.fl.includes("f")?"<small>a partir de</small>":""}${R(price(v.id,s.m))}</div></div>`}).join("");
  h+=`<p class="mu noprint" style="margin-top:8px">Valores sujeitos à confirmação após avaliação do aparelho.</p>`;
  if(sl.length){
    const msg=`Olá, JP Acessórios! Fiz um orçamento pelo site:\n\nAparelho: ${nm(m)}\n${sl.map(v=>`• ${v.n}: ${v.fl.includes("f")?"a partir de ":""}${R(price(v.id,s.m))}`).join("\n")}\n\nTotal: ${pre}${R(tot)}\n\nGostaria de seguir com o reparo.`;
    const dt=new Date(),ds=dt.toLocaleDateString("pt-BR"),qn="JP-"+ds.split("/").reverse().join("").slice(2)+"-"+dt.toTimeString().slice(0,5).replace(":","");
    const qs=`<div class="qs"><div class="qh"><img src="logo.png" alt=""><div><h1>Orçamento de reparo</h1><p>Nº ${qn} · ${ds}</p></div></div>
    <div class="qd"><span>Aparelho</span><b>${e(nm(m))}</b></div>
    ${sl.map(v=>`<div class="qr"><div><h3>${e(v.n)}</h3><p>${e(v.d)}</p>${v.fl.includes("g")?"<i>Garantia contratual de 1 ano</i>":""}</div><strong>${v.fl.includes("f")?"<small>a partir de</small>":""}${R(price(v.id,s.m))}</strong></div>`).join("")}
    <div class="qt"><span>Total do orçamento</span><strong>${pre}${R(tot)}</strong></div>
    ${sl.some(v=>v.fl.includes("r"))?`<p class="qn rk"><b>Antes de trocar o vidro.</b> ${RISCO}</p>`:""}
    <p class="qn">Valores sujeitos à confirmação após avaliação do aparelho.</p>
    <a class="qc" href="${link(msg)}">Para aprovar este orçamento, chame no WhatsApp<b>+55 41 9805-6741</b></a>
    <div class="qf">Av. Toaldo Túlio, 3110 · @jpcellacessorios_</div></div>`;
    h+=`<div class="sum"><span>${sl.length} serviço${sl.length>1?"s":""}<br><strong id="tot" data-v="${tot}" data-p="${pre}">${pre}${R(tot)}</strong></span><span class="noprint"><button class="btn" data-a="pdf">Baixar PDF</button> <a class="btn g" href="${link(msg)}">Pedir no WhatsApp</a></span></div>${qs}`;
  }else if(l.length)h+=`<div class="sum noprint"><span>Toque nos serviços para montar o orçamento.</span><a class="btn g" href="${link("Olá! Tenho uma dúvida sobre o reparo do "+nm(m))}">Tirar dúvida</a></div>`;
  return h;
}

/* anima o total quando muda */
function cu(){
  const t=$("#tot");if(!t){lastT=0;return}
  const to=+t.dataset.v,pre=t.dataset.p||"",f=lastT;lastT=to;if(f==to)return;
  const t0=performance.now();
  (function st(n){const k=Math.min(1,(n-t0)/500),v=f+(to-f)*(1-Math.pow(1-k,3));t.textContent=pre+R(Math.round(v));if(k<1)requestAnimationFrame(st)})(t0);
}

/* ===== PAINEL ADMIN ===== */
function adm(){
  if(!authed)return `<h2 class="keep">Área restrita</h2><div style="max-width:340px;display:grid;gap:10px"><input id="u" placeholder="${sb?"E-mail":"Usuário"}"><input id="p" type="password" placeholder="Senha"><button class="btn" style="background:var(--fl);color:#fff" data-a="in">Entrar</button><p id="er" style="color:var(--wr)"></p>${sb?"":'<p class="mu">Modo demonstração: os dados ficam salvos só neste navegador.</p>'}<a href="#" style="color:var(--mu)">Voltar ao site</a></div>`;
  const sv=D.services.find(x=>x.id==cs)||D.services[0];cs=sv.id;
  const row=(l,r)=>`<div class="row"><span>${l}</span>${r}</div>`;
  return `<div class="row"><h2 class="keep" style="margin:0;flex:1">Painel JP Acessórios</h2><a class="btn" style="background:var(--card)" href="#">Ver site</a><button class="btn" style="background:var(--card)" data-a="out">Sair</button></div>
  <h2>Preços por serviço</h2>
  <select data-a="sv">${D.services.map(x=>`<option value="${x.id}"${x.id==sv.id?" selected":""}>${e(x.n)}</option>`).join("")}</select>
  <p class="mu" style="margin:8px 0">Deixe o campo vazio para marcar como indisponível naquele modelo.</p>
  ${D.models.filter(m=>m.t==ty(sv)).map(m=>row(e(nm(m)),`<input type="number" min="0" data-k="${e(sv.id+"|"+m.n)}" value="${D.prices[sv.id+"|"+m.n]||""}" placeholder="indisponível">`)).join("")}
  <h2>Ajuste em lote</h2>
  ${row("Reajustar todos os preços em %",`<input id="pc" type="number" placeholder="ex.: 10 ou -5"><button class="btn" style="background:var(--fl)" data-a="pct">Aplicar</button>`)}
  <h2>Aparelhos</h2>
  ${row("Novo aparelho",`<input id="nn" placeholder="ex.: 18 ou Série 12"><select id="nt"><option value="i">iPhone</option><option value="w">Apple Watch</option></select><button class="btn" style="background:var(--fl)" data-a="am">Adicionar</button>`)}
  ${D.models.map((m,i)=>row(e(nm(m)),`<button class="chip${m.on?" on":""}" data-a="tm" data-v="${i}">${m.on?"Visível":"Oculto"}</button><button class="chip" data-a="dm" data-v="${i}" >Remover</button>`)).join("")}
  <h2>Serviços</h2>
  <p class="mu" style="margin-bottom:8px">Serviços novos aparecem na opção “Ver todos os serviços”. Cadastre os preços acima.</p>
  <div style="display:grid;gap:8px;margin-bottom:10px"><input id="sn" placeholder="Nome do serviço"><input id="sd" placeholder="Descrição curta"><div class="row" style="border:0"><select id="st"><option value="i">iPhone</option><option value="w">Apple Watch</option></select><label><input type="checkbox" id="sg" style="width:auto"> Garantia 1 ano</label><label><input type="checkbox" id="sf" style="width:auto"> “A partir de”</label><button class="btn" style="background:var(--fl)" data-a="as">Adicionar</button></div></div>
  ${D.services.map((v,i)=>row(e(v.n),`<button class="chip${v.on?" on":""}" data-a="ts" data-v="${i}">${v.on?"Ativo":"Inativo"}</button><button class="chip" data-a="ds" data-v="${i}" >Remover</button>`)).join("")}
  <div class="sum"><span>${sb?"Salvar publica as mudanças no site.":"Modo demonstração: salva só neste navegador."}</span><span><button class="btn" data-a="exp">Backup</button> <button class="btn" style="background:var(--fl)" data-a="save">Salvar alterações</button></span></div>`;
}

/* ===== EVENTOS ===== */
function render(){A.innerHTML=ad?adm():home();s.fx="";cu();if(s.dd&&!ad&&matchMedia("(hover:hover)").matches){const i=$("#mq");if(i)i.focus()}}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a]");if(!b||b.tagName=="SELECT")return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a=="rk")s.rk=!s.rk;
  else if(a=="dd"){s.dd=!s.dd;s.fx=s.dd?"dd":""}
  else if(a=="em"){s.m=null;s.dd=true;s.mq="";s.fx="dd"}
  else if(a=="ey"){s.ids=null;s.lab="";s.note="";s.fx="y"}
  else if(a=="t")s={...s,t:v,m:null,ids:v=="w"?"all":null,lab:"",note:"",sel:[],dd:true,mq:""};
  else if(a=="m"){s.m=v;s.sel=[];s.dd=false;s.mq="";if(s.t=="w")s.ids="all";s.fx=s.ids?"res":"y"}
  else if(a=="y"){s.ids=Y[v][3].split(",");s.lab=Y[v][1];s.note=""}
  else if(a=="all"){s.ids="all";s.lab="";s.note=""}
  else if(a=="q"){
    const r=match(s.q);
    if(r.length){s.ids=[...new Set(r.flatMap(i=>Y[i][3].split(",")))];s.lab=r.map(i=>Y[i][1]).join(" + ");s.note=""}
    else{s.ids="all";s.lab="";s.note="Não consegui identificar o problema pelo texto. Veja todos os serviços abaixo ou fale com a gente no WhatsApp."}
  }
  else if(a=="s")s.sel=s.sel.includes(v)?s.sel.filter(x=>x!=v):[...s.sel,v];
  else if(a=="pdf"){print();return}
  else if(a=="in"){
    const u=$("#u").value,p=$("#p").value;
    if(sb){const{error}=await sb.auth.signInWithPassword({email:u,password:p});authed=!error}
    else authed=u==CFG.demoUser&&p==CFG.demoPass;
    if(!authed){$("#er").textContent="Usuário ou senha incorretos. Confira e tente de novo.";return}
  }
  else if(a=="out"){if(sb)await sb.auth.signOut();authed=false}
  else if(a=="pct"){
    const p=parseFloat($("#pc").value);if(!p)return;
    if(!confirm("Reajustar todos os preços em "+p+"%?"))return;
    Object.keys(D.prices).forEach(k=>D.prices[k]=Math.round(D.prices[k]*(1+p/100)/5)*5);toast("Preços reajustados");
  }
  else if(a=="am"){const n=$("#nn").value.trim(),t=$("#nt").value;if(n&&!D.models.some(m=>m.n==n&&m.t==t))D.models.push({n,t,on:1})}
  else if(a=="tm")D.models[v].on=D.models[v].on?0:1;
  else if(a=="dm"){if(confirm("Remover este aparelho e seus preços?")){const m=D.models.splice(v,1)[0];Object.keys(D.prices).filter(k=>k.endsWith("|"+m.n)).forEach(k=>delete D.prices[k])}}
  else if(a=="as"){
    const n=$("#sn").value.trim();if(!n)return;
    D.services.push({id:"s"+Date.now(),n,d:$("#sd").value.trim(),fl:($("#sg").checked?"g":"")+($("#sf").checked?"f":"")+($("#st").value=="w"?"W":""),on:1});
  }
  else if(a=="ts")D.services[v].on=D.services[v].on?0:1;
  else if(a=="ds"){if(confirm("Remover este serviço e seus preços?")){const x=D.services.splice(v,1)[0];Object.keys(D.prices).filter(k=>k.startsWith(x.id+"|")).forEach(k=>delete D.prices[k])}}
  else if(a=="save"){toast(await save()?"Alterações salvas":"Erro ao salvar. Verifique a conexão e o login.");return}
  else if(a=="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));l.download="jp-backup.json";l.click();return}
  if(["y","all","q"].includes(a)&&s.ids)s.fx="res";
  render();
});
document.addEventListener("change",ev=>{if(ev.target.dataset.a=="sv"){cs=ev.target.value;render()}});
document.addEventListener("input",ev=>{
  const i=ev.target;
  if(i.id=="q")s.q=i.value;
  if(i.id=="mq"){s.mq=i.value;$("#ml").innerHTML=mlist()}
  if(i.dataset.k){const v=parseFloat(i.value);if(v>0)D.prices[i.dataset.k]=v;else delete D.prices[i.dataset.k]}
});
document.addEventListener("keydown",ev=>{if(ev.key=="Enter"&&ev.target.id=="q")$("[data-a=q]").click()});
function hc(){ad=location.hash=="#admin";render();scrollTo(0,0)}
addEventListener("hashchange",hc);
(async()=>{
  D=await load();
  if(sb){const r=await sb.auth.getSession();authed=!!(r.data&&r.data.session)}
  hc();
})();
</script>
